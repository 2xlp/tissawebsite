<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable – TissaWeb</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C1310">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C1310'/%3E%3Cpath d='M8 10h16M16 10v14' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--ink:#0C1310;--accent:#0B7A55;--web:#3DDC97;--muted:#9FAAA4}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ink);color:#fff;font-family:"Onest",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
.box{position:relative;max-width:520px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font:800 1.4rem "Schibsted Grotesk",sans-serif;color:#fff;text-decoration:none;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--web)}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.code{font:800 clamp(5rem,22vw,9rem)/1 "Schibsted Grotesk",sans-serif;letter-spacing:-.05em;margin:38px 0 6px;background:linear-gradient(180deg,#fff,#5f6b65);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font:700 1.6rem "Schibsted Grotesk",sans-serif;margin:0 0 12px;letter-spacing:-.02em}
p{color:var(--muted);line-height:1.6;margin:0 0 30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:12px;font-weight:600;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn-a{background:var(--accent);color:#fff}.btn-a:hover{background:#08603F}
.btn-o{border:1px solid rgba(255,255,255,.2);color:#fff}.btn-o:hover{background:rgba(255,255,255,.06)}
</style>
</head>
<body>
<main class="box">
  <a href="/" class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M3 5h14" stroke="#fff"/><path d="M10 5v12" stroke="#fff"/><path d="M5.5 10.5h3" stroke="#fff" opacity=".55"/><path d="M11.5 10.5h3" stroke="#fff" opacity=".55"/></svg></span><span>Tissa<em>Web</em></span></a>
  <div class="code">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être ancien ou mal recopié. Pas de souci : tout ce qu'il vous faut est sur la page d'accueil.</p>
  <div class="btns"><a class="btn btn-a" href="/">Retour à l'accueil</a><a class="btn btn-o" href="/#contact">Demander un devis</a></div>
</main>
<script src="/i18n.js" defer></script>
<script src="/stats.js" defer></script>
</body>
</html>
